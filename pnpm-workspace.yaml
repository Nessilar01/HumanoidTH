# Baseline B2: pnpm 10+ blocks dependency build scripts unless they are approved,
# and pnpm 12 turns that into a hard error (ERR_PNPM_IGNORED_BUILDS) on a fresh clone.
# These six packages need their install scripts (Prisma engines, esbuild, sharp).
# pnpm 12 reads this file; pnpm 9/10 read "pnpm.onlyBuiltDependencies" in package.json.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
