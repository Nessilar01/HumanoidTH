# Baseline B2: pnpm blocks dependency build scripts unless they are approved, and
# pnpm 11/12 turn that into a hard error (ERR_PNPM_IGNORED_BUILDS) on a fresh clone.
# These six packages need their install scripts (Prisma engines, esbuild, sharp).
# Both keys live here on purpose: pnpm 11/12 read "allowBuilds", pnpm 10 reads
# "onlyBuiltDependencies", and pnpm 11+ no longer reads the "pnpm" field in package.json.
# Tested: pnpm 10.28.0, 11.28.2, 12.8.1, no warnings.
# DO NOT delete this file: without it a fresh install fails.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
